<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>local street food — find street food near you</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      height: 100dvh; display: flex; flex-direction: column;
      overflow: hidden; background: #f5f5f5; color: #111;
    }

    /* ── HEADER ── */
    #header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      padding: 0 16px;
      height: 52px;
      gap: 14px;
      background: #fff;
      border-bottom: 2px solid #111;
      flex-shrink: 0;
      z-index: 1001;
    }
    .hd-left { display: flex; align-items: center; gap: 9px; }
    .hd-right { display: flex; align-items: center; }

    .logo-mark {
      width: 24px; height: 24px; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
    }
    .logo-text { font-size: 15px; font-weight: 700; letter-spacing: -0.4px; color: #111; white-space: nowrap; }
    .beta-pill {
      font-size: 10px; font-weight: 600; color: #111;
      background: #fff; border: 1px solid #d0d0d0;
      border-radius: 4px; padding: 1px 5px; white-space: nowrap;
    }
    #add-btn {
      background: #fff; color: #111; border: 1px solid #d0d0d0; border-radius: 6px;
      padding: 6px 14px; font-size: 13px; cursor: pointer; white-space: nowrap;
      font-weight: 400; letter-spacing: -0.1px;
      font-family: inherit;
    }
    #add-btn:hover { background: #f5f5f5; }

    /* ── SEARCH ── */
    #search-wrap { position: relative; }
    #search-row  { position: relative; }
    #search-input {
      width: 100%; padding: 7px 12px 7px 32px;
      border: 1px solid #999; border-radius: 6px;
      background: #fafafa; font-size: 13px; font-family: inherit;
      color: #111; outline: none; transition: border-color 0.15s;
    }
    #search-input:focus { border-color: #999; background: #fff; }
    #search-input::placeholder { color: #bbb; }
    .si-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; }

    #search-drop {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 2000;
      background: #fff; border: 1px solid #e5e5e5; border-radius: 10px;
      max-height: 400px; overflow-y: auto;
      box-shadow: 0 6px 24px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
    }
    .dr { padding: 10px 13px; cursor: pointer; border-bottom: 1px solid #f0f0f0; transition: background 0.1s; }
    .dr:last-child { border-bottom: none; }
    .dr:hover, .dr.kact { background: #f8f8f8; }
    .dr-name { font-size: 14px; font-weight: 600; color: #111; }
    .dr-sub  { font-size: 12px; color: #999; margin-top: 2px; }
    /* Empty-state suggestion chips */
    .srch-shortcuts { padding: 8px 12px 10px; }
    .srch-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .srch-chip {
      padding: 5px 12px; border-radius: 20px;
      border: 1px solid #e8e8e8; background: #f6f6f6;
      font-size: 12px; color: #444; font-family: inherit;
      cursor: pointer; transition: background 0.1s, border-color 0.1s;
      white-space: nowrap;
    }
    .srch-chip:hover { background: #ececec; border-color: #ccc; }
    .dr-none    { padding: 14px; font-size: 13px; color: #aaa; text-align: center; }
    .dr-section { padding: 5px 13px 3px; font-size: 10px; font-weight: 700; color: #aaa; letter-spacing: 0.5px; text-transform: uppercase; }

    /* ── LOCATION BEACON ── */
    .user-beacon { position: relative; width: 22px; height: 22px; }
    .user-beacon-dot {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 13px; height: 13px;
      background: #007AFF; border: 2.5px solid white;
      border-radius: 50%; box-shadow: 0 1px 5px rgba(0,0,0,0.35); z-index: 2;
    }
    .user-beacon-ring {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 13px; height: 13px; border-radius: 50%;
      background: rgba(0,122,255,0.35);
      animation: beacon-pulse 2s ease-out infinite;
    }
    @keyframes beacon-pulse {
      0%   { transform: translate(-50%,-50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(4); opacity: 0; }
    }

    /* ── MAIN ── */
    #main { flex: 1; display: flex; flex-direction: row; position: relative; min-height: 0; overflow: hidden; }

    /* ── MAP fills full #main ── */
    #map-wrap { flex: 1; position: relative; min-width: 0; }


    /* Status chip colours (used in sheet) */
    .vi-status { font-size: 14px; font-weight: 400; color: #555; }
    .vi-status.open         .vi-key { color: #16a34a; }
    .vi-status.closing-soon .vi-key { color: #d97706; }
    .vi-status.upcoming     .vi-key { color: #dc2626; }
    .vi-status.future       .vi-key { color: #dc2626; }

    /* Gallery arrows — sit inside the photo mosaic, overlapping the left/right edges */
    .gal-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.93); border: none;
      width: 28px; height: 28px; border-radius: 50%;
      font-size: 18px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #111; z-index: 2;
      box-shadow: 0 1px 6px rgba(0,0,0,0.22);
    }
    .gal-arrow:hover { background: #fff; }
    #gal-prev { left: 10px; } #gal-next { right: 10px; }
    #gal-dots {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 4px; align-items: center;
    }
    .gal-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(255,255,255,0.55); cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }
    .gal-dot.active { background: #fff; transform: scale(1.3); }
    .gal-count {
      background: rgba(0,0,0,0.5); color: #fff;
      font-size: 11px; font-weight: 500; padding: 2px 8px;
      border-radius: 10px;
    }

    /* ── BOTTOM SHEET ── */
    #sheet-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 800;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #sheet-overlay.open { opacity: 1; pointer-events: auto; }

    /* 3 cards wide: 3×280px + 2×10px gaps ≈ 880px, centred */
    #vendor-sheet {
      position: fixed;
      left: 50%; bottom: 0;
      width: min(880px, calc(100% - 24px));
      height: 88vh; /* JS overrides this to align ceiling with zoom control */
      background: #fff;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 32px rgba(0,0,0,0.18);
      z-index: 900;
      display: flex; flex-direction: column;
      transform: translateX(-50%) translateY(100%);
      transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
      overflow: hidden;
    }
    /* JS owns all transforms on #vendor-sheet — the .open class is a state marker only */

    /* X sits top-right, in the white margin above the mosaic */
    #sheet-close {
      position: absolute; right: 16px; top: 12px; z-index: 10;
      width: 28px; height: 28px;
      background: #f0f0f0; border: none; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: #555;
    }
    #sheet-close:hover { background: #e0e0e0; }

    /* Wrapper: just a width/margin container */
    #gallery-wrap {
      width: calc(100% - 40px);  /* 20px each side */
      margin: 36px auto 8px;    /* 36px top clears the X button, 20px sides */
    }
    /* Mosaic gallery — clipping container for the sliding strip */
    #sheet-gallery {
      height: 320px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;  /* anchor for the arrow buttons */
    }
    /* Sliding strip — all groups laid out horizontally, moved via translateX */
    #sg-strip {
      display: flex;
      width: 100%;
      height: 100%;
    }
    /* Each group fills the full gallery width — 1 big + 4 small in a 3-col grid */
    .sg-group {
      min-width: 100%;
      flex-shrink: 0;
      height: 100%;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 6px;
    }
    /* Big photo: left column, full height */
    .sg-ph-big {
      grid-row: 1 / 3;
      background-size: cover; background-position: center;
      background-color: #e0e0e0;
      cursor: pointer; transition: filter 0.12s;
    }
    /* Small photos: auto-fill remaining 4 grid cells */
    .sg-ph-sm {
      background-size: cover; background-position: center;
      background-color: #e0e0e0;
      cursor: pointer; transition: filter 0.12s;
    }
    .sg-ph-big:hover, .sg-ph-sm:hover { filter: brightness(0.86); }
    .sg-ph-placeholder {
      background: #f0f0f0; cursor: default;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── LIGHTBOX ── */
    #lightbox {
      position: fixed; inset: 0; z-index: 1100;
      background: rgba(0,0,0,0.92);
      display: none; align-items: center; justify-content: center;
    }
    #lightbox.open { display: flex; }
    #lb-photo {
      width: 100%; height: 100%;
      background-size: contain; background-position: center; background-repeat: no-repeat;
    }
    #lb-close {
      position: absolute; top: 14px; right: 14px;
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.15); border: none;
      color: #fff; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #lb-close:hover { background: rgba(255,255,255,0.25); }
    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.15); border: none;
      color: #fff; font-size: 22px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .lb-nav:hover { background: rgba(255,255,255,0.28); }
    #lb-prev { left: 14px; } #lb-next { right: 14px; }
    #lb-count {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.7); font-size: 12px; font-weight: 500;
    }

    /* Single scrollable column — gallery + body content scroll together */
    #sheet-scroll {
      flex: 1; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #sheet-body {
      padding: 16px 0 40px;
    }
    /* Text column: same centering as gallery but with a small inset each side */
    #sheet-inner {
      width: calc(100% - 40px);  /* matches gallery-wrap */
      margin: 0 auto;
      padding: 0 18px;           /* text sits slightly inside the gallery edges */
    }
    #sheet-name    { font-size: 22px; font-weight: 700; color: #111; line-height: 1.2; margin-bottom: 3px; }
    #sheet-cuisine { font-size: 14px; color: #555; margin-bottom: 3px; }
    #sheet-location {
      font-size: 14px; color: #555; margin-bottom: 3px;
      display: flex; align-items: flex-start; gap: 5px;
    }
    #sheet-status  { font-size: 14px; margin-bottom: 16px; display: flex; align-items: center; gap: 5px; }
    #sheet-desc { font-size: 14px; color: #555; line-height: 1.6; margin-bottom: 16px; border-top: 1px solid #f0f0f0; padding-top: 16px; margin-top: 4px; }
    #sheet-website { font-size: 12px; margin-bottom: 6px; }
    #sheet-website a { color: #555; text-decoration: none; }
    #sheet-website a:hover { text-decoration: underline; }
    .sheet-diet-tag {
      font-size: 11px; font-weight: 600; padding: 3px 9px;
      border-radius: 4px; border: 1px solid #ddd;
      background: #f7f7f7; color: #555;
    }
    #sheet-dietary { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    #sheet-sched { margin-bottom: 18px; font-size: 13px; color: #bbb; }
    .ig-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: #555; text-decoration: none;
      padding: 6px 0; margin-top: 4px;
    }
    .ig-link:hover { color: #111; }

    /* ── MAP ── */
    #map-wrap { flex: 1; position: relative; min-width: 0; }
    #map { width: 100%; height: 100%; }

    /* ── PIN NAME TOOLTIP (reserved for future mobile use) ── */
    #pin-tooltip {
      position: absolute; z-index: 901;
      background: #fff;
      color: #111; font-size: 13px; font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.18);
      pointer-events: none; /* never blocks map interaction */
      display: none; white-space: nowrap;
    }

    /* ── MAP HOVER POPUP ── */
    #map-popup {
      position: absolute; z-index: 900;
      width: 300px; background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18);
      overflow: hidden; display: none; pointer-events: auto;
      cursor: pointer;
    }
    #popup-photo {
      position: relative;
      width: 100%; height: 225px; /* 300×225 = 4:3 — standard camera/food photo ratio */
      background-size: cover; background-position: center; background-color: #eee;
    }
    /* Compact popup when no photo is available */
    #map-popup.no-photo #popup-photo { display: none; }
    #map-popup.no-photo #popup-body  { padding-top: 14px; }
    /* Photo navigation arrows — visible on hover when multiple photos exist */
    .pp-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.88); border: none; border-radius: 50%;
      width: 28px; height: 28px; padding: 0;
      display: none; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px; line-height: 1; color: #111; z-index: 2;
      box-shadow: 0 1px 5px rgba(0,0,0,0.22);
    }
    #popup-photo:hover .pp-nav.pp-visible { display: flex; }
    .pp-prev { left: 8px; }
    .pp-next { right: 8px; }
    #pp-count {
      position: absolute; bottom: 7px; right: 9px;
      background: rgba(0,0,0,0.52); color: #fff;
      font-size: 11px; font-weight: 500; padding: 2px 7px;
      border-radius: 10px; display: none;
    }
    #popup-photo:hover #pp-count.pp-visible { display: block; }
    #popup-body { padding: 12px 14px 14px; }
    #popup-name { font-size: 14px; font-weight: 700; color: #111; line-height: 1.3; }
    #popup-cuis { font-size: 13px; color: #555; margin-top: 2px; }
    #popup-loc  {
      font-size: 13px; color: #555; margin-top: 1px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #popup-status { margin-top: 5px; font-size: 13px; }

    /* ── PINS ── */
    .fvm-pin {
      position: relative; display: inline-block;
      cursor: pointer; user-select: none;
      transition: transform 0.08s ease-out, opacity 0.15s ease-out;
    }
    .fvm-pin:hover, .fvm-pin.hov { transform: scale(1.2); }
    .fvm-pin.sel                 { transform: scale(1.2); }
    .fvm-pin.dimmed              { opacity: 0.3; }
    /* While a popup is open, freeze all non-active pins — no hover, no pointer events */
    #map-wrap.popup-active .fvm-pin:not(.hov) { pointer-events: none; }
    .pin-body { fill: #00b4d8; }

    /* ── Popup icon links (Instagram, Website) ── */
    #popup-links { display: flex; gap: 8px; margin-top: 10px; }
    .pop-icon-link {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 50%;
      border: 1px solid #e0e0e0; color: #555; text-decoration: none;
      flex-shrink: 0;
    }
    .pop-icon-link:hover { background: #f5f5f5; border-color: #bbb; color: #111; }
    .pin-label {
      position: absolute; left: 26px; top: 5px; white-space: nowrap; cursor: pointer;
      font-size: 13px; font-weight: 400; color: #222; letter-spacing: -0.1px;
      -webkit-font-smoothing: antialiased;
      text-shadow:
        -2px -2px 0 #fff,  2px -2px 0 #fff,
        -2px  2px 0 #fff,  2px  2px 0 #fff,
        -2px  0   0 #fff,  2px  0   0 #fff,
         0   -2px 0 #fff,  0    2px 0 #fff,
         0 0 8px #fff, 0 0 14px rgba(255,255,255,0.9);
      transition: opacity 0.2s ease;
    }
    .pin-label.lbl-hidden { opacity: 0; pointer-events: none; }

    /* ── LOADING OVERLAY ── */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 2000;
      background: #fff; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      transition: opacity 0.3s ease;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 28px; height: 28px;
      border: 2.5px solid #eee; border-top-color: #111;
      border-radius: 50%; animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 13px; color: #aaa; }

    /* ── MARKER CLUSTER ── */
    .lsf-cluster {
      width: 36px; height: 36px; background: #111; color: #fff;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      border: 2.5px solid #fff;
    }
    .lsf-cluster.big { width: 44px; height: 44px; font-size: 13px; }

    /* ── LEAFLET ── */
    .leaflet-control-zoom { border: none !important; }
    .leaflet-control-zoom a {
      border-radius: 6px !important; border: 1px solid #d0d0d0 !important;
      color: #111 !important; font-size: 16px !important;
      width: 32px !important; height: 32px !important; line-height: 30px !important;
      margin-bottom: 4px !important; background: #fff !important;
    }
    .leaflet-control-zoom a:hover { background: #f5f5f5 !important; }
    .leaflet-control-attribution { font-size: 10px !important; }
    .leaflet-popup-content-wrapper { display: none; }
    .locate-btn {
      background: #fff !important; border: 1px solid #d0d0d0 !important;
      border-radius: 6px !important;
      width: 32px !important; height: 32px !important;
      display: flex !important; align-items: center !important;
      justify-content: center !important; cursor: pointer !important;
    }
    .locate-btn:hover { background: #f5f5f5 !important; }
    /* Override default markercluster styles */
    .leaflet-cluster-anim .leaflet-marker-icon,
    .leaflet-cluster-anim .leaflet-marker-shadow { transition: transform 0.3s ease-out, opacity 0.3s ease-in; }

  </style>
</head>
<body>

<!-- ══ LOADING OVERLAY ══ -->
<div id="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading vendors…</div>
</div>

<!-- ══ HEADER ══ -->
<div id="header">
  <div class="hd-left">
    <div class="logo-mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Bowl with steam — street food symbol -->
        <path d="M4 11h16a8 8 0 0 1-16 0z"/>
        <path d="M12 2c0 0-2 1.5-2 3s2 2 2 3.5"/>
        <path d="M8 2c0 0-1.5 1.5-1.5 3S8 7 8 8.5"/>
        <path d="M16 2c0 0-1.5 1.5-1.5 3S16 7 16 8.5"/>
        <line x1="6" y1="19" x2="18" y2="19"/>
      </svg>
    </div>
    <span class="logo-text">local street food</span>
    <span class="beta-pill">beta</span>
  </div>

  <div id="search-wrap">
    <div id="search-row">
      <svg class="si-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2.5" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/>
      </svg>
      <input id="search-input" type="text"
             placeholder="Search vendors, cuisines, areas…"
             autocomplete="off" role="combobox"
             aria-expanded="false" aria-haspopup="listbox"/>
    </div>
    <div id="search-drop" hidden role="listbox"></div>
  </div>

  <div class="hd-right">
    <button id="add-btn" onclick="addYourListing()">+ Add your listing</button>
  </div>
</div>

<!-- SVG filter definitions shared by all pins -->
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <filter id="pin-shadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
</svg>

<!-- ══ MAIN ══ -->
<div id="main">

  <!-- ══ MAP (fills full #main area) ══ -->
  <div id="map-wrap">
    <div id="map"></div>

    <!-- Name tooltip — reserved for mobile/touch use -->
    <div id="pin-tooltip"></div>

    <div id="map-popup">
      <div id="popup-photo">
        <button class="pp-nav pp-prev" onclick="ppStep(-1,event)" aria-label="Previous photo">&#8249;</button>
        <button class="pp-nav pp-next" onclick="ppStep(1,event)"  aria-label="Next photo">&#8250;</button>
        <div id="pp-count"></div>
      </div>
      <div id="popup-body">
        <div id="popup-name"></div>
        <div id="popup-cuis"></div>
        <div id="popup-loc"></div>
        <div id="popup-status"></div>
        <div id="popup-links"></div>
      </div>
    </div>
  </div>

</div><!-- /main -->

<!-- ══ BOTTOM SHEET ══ -->
<div id="sheet-overlay" onclick="closeSheet()"></div>
<div id="vendor-sheet" role="dialog" aria-modal="true">
  <!-- X sits in the white margin above the mosaic -->
  <button id="sheet-close" onclick="closeSheet()" aria-label="Close">
    <svg width="10" height="10" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M1 1l12 12M13 1L1 13"/>
    </svg>
  </button>
  <div id="sheet-scroll">
    <div id="gallery-wrap">
      <div id="sheet-gallery">
        <div id="sg-strip"></div>
        <button class="gal-arrow" id="gal-prev" onclick="galPageStep(-1,event)" aria-label="Previous photos" style="display:none">&#8249;</button>
        <button class="gal-arrow" id="gal-next" onclick="galPageStep(1,event)"  aria-label="More photos"     style="display:none">&#8250;</button>
      </div>
    </div>
    <div id="sheet-body">
      <div id="sheet-inner">
        <div id="sheet-name"></div>
        <div id="sheet-website"></div>
        <div id="sheet-cuisine"></div>
        <div id="sheet-location"></div>
        <div id="sheet-status" class="vi-status"></div>
        <div id="sheet-sched"></div>
        <div id="sheet-dietary"></div>
        <div id="sheet-desc"></div>
        <div id="sheet-instagram"></div>
      </div>
    </div>
  </div>
</div>

<!-- ══ LIGHTBOX ══ -->
<div id="lightbox">
  <div id="lb-photo"></div>
  <button id="lb-close" onclick="closeLightbox()" aria-label="Close">
    <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M1 1l12 12M13 1L1 13"/></svg>
  </button>
  <button class="lb-nav" id="lb-prev" onclick="lbStep(-1)" aria-label="Previous">&#8249;</button>
  <button class="lb-nav" id="lb-next" onclick="lbStep(1)" aria-label="Next">&#8250;</button>
  <div id="lb-count"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script>
// ════════════════════════════════════════════════════════
//  DATA — loaded async from vendors.json
// ════════════════════════════════════════════════════════
let VENDORS = [];
let clusterGroup = null;

// Cuisine sysName → human label
const CUISINE_LABEL = {
  bbq:'BBQ', caterers:'Caterers', canapes:'Canapés',
  desserts_and_treats:'Desserts & Treats', drop_off:'Drop-off Catering',
  office_catering:'Office Catering', private_chef:'Private Chef',
  sit_down_catering:'Sit-down Catering', street_food:'Street Food',
  buffet:'Buffet', mobile_bar:'Mobile Bar', cocktails:'Cocktails',
  coffee_hot_drinks:'Coffee & Hot Drinks', drinks_reception:'Drinks Reception',
  full_bar_service:'Full Bar Service', juices_and_smoothies:'Juices & Smoothies',
  live_music:'Live Music', christmas_party:'Christmas Party',
  conference:'Conference', virtual:'Virtual',
  marquees_tipis:'Marquees & Tipis', florists:'Florists',
};

function cuisineLabel(arr) {
  if (!arr || !arr.length) return 'Street Food';
  return arr.slice(0, 2).map(s => CUISINE_LABEL[s] || s.replace(/_/g, ' ')).join(' · ');
}

// ════════════════════════
//  STATE
// ════════════════════════
let selectedVendor  = null;
let markerMap    = {};
let nearLabel    = null;
let _progMove    = false;
let _userMarker  = null;
let galPhotos   = [];
let galIdx      = 0;
let galPage     = 0;

// ════════════════════════
//  PHOTO HELPER
// ════════════════════════
function photoUrl(url, w=320, h=320) {
  if (!url) return "";
  if (url.includes("res.cloudinary.com")) {
    return url.replace("/upload/", `/upload/w_${w},h_${h},c_fill,g_auto/`);
  }
  // Route Togather/Feast-It imgix photos through Netlify proxy so the
  // request originates from Netlify's servers (no Referer = no hotlink block).
  // imgix resize/format params are added for efficiency.
  if (url.includes("feast-it-web-prod.imgix.net")) {
    const path = url.replace("https://feast-it-web-prod.imgix.net", "");
    const sep  = path.includes('?') ? '&' : '?';
    return `/img-proxy${path}${sep}w=${w}&h=${h}&fit=crop&auto=format&q=75`;
  }
  if (url.includes("imgix.net")) {
    const sep = url.includes('?') ? '&' : '?';
    return `${url}${sep}w=${w}&h=${h}&fit=crop&auto=format&q=75`;
  }
  return url;
}

// ════════════════════════
//  MAP HOVER POPUP
// ════════════════════════
let _popupHideTimer = null;
let _popupVendor = null;
let _hoverTimer = null;
let _popupLocked = false;

function showMapPopup(vendor) {
  _popupVendor = vendor;
  const mapEl  = document.getElementById("map");
  const marker = markerMap[vendor.id];
  if (!marker) return;
  const pinLL = marker.getLatLng();
  const pt    = map.latLngToContainerPoint(pinLL);
  const mapW  = mapEl.offsetWidth;
  const mapH  = mapEl.offsetHeight;

  const popup = document.getElementById("map-popup");
  _ppPhotos = vendor.photos || (vendor.photo ? [vendor.photo] : []);
  const hasPhoto = _ppPhotos.length > 0;
  popup.classList.toggle("no-photo", !hasPhoto);
  if (hasPhoto) { ppShowPhoto(0); preloadPopupPhotos(_ppPhotos); }

  document.getElementById("popup-name").textContent = vendor.name;
  document.getElementById("popup-cuis").textContent = vendor.tagline || cuisineLabel(vendor.cuisine);

  const locEl = document.getElementById("popup-loc");
  locEl.textContent   = vendor.city || "";
  locEl.style.display = vendor.city ? "block" : "none";

  // No schedule status for Togather vendors
  const stEl = document.getElementById("popup-status");
  stEl.innerHTML = "";
  stEl.className = "";

  const igSvg  = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>`;
  const webSvg = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`;
  const links = [
    vendor.instagram ? `<a class="pop-icon-link" href="https://instagram.com/${vendor.instagram.replace(/^@/,'')}" target="_blank" rel="noopener" title="Instagram">${igSvg}</a>` : '',
    vendor.website   ? `<a class="pop-icon-link" href="${vendor.website.startsWith('http') ? vendor.website : 'https://'+vendor.website}" target="_blank" rel="noopener" title="Website">${webSvg}</a>` : '',
  ].filter(Boolean).join('');
  document.getElementById("popup-links").innerHTML = links;

  popup.style.display = "block";
  const popW = popup.offsetWidth;
  const popH = popup.offsetHeight;

  let left = pt.x - popW / 2;
  let top  = pt.y - 39 - popH - 10;
  if (top < 8) top = pt.y + 14;
  left = Math.max(8, Math.min(left, mapW - popW - 8));
  top  = Math.max(8, Math.min(top,  mapH - popH - 8));

  popup.style.left = left + "px";
  popup.style.top  = top  + "px";
  document.getElementById("map-wrap").classList.add("popup-active");
}

// ── Popup photo navigation ──
let _ppPhotos = [];
let _ppIdx    = 0;

function ppShowPhoto(idx) {
  _ppIdx = idx;
  const photo   = _ppPhotos[idx];
  const photoEl = document.getElementById('popup-photo');
  photoEl.style.backgroundImage = photo ? `url('${photoUrl(photo, 600, 450)}')` : 'none';
  const multi = _ppPhotos.length > 1;
  const countEl = document.getElementById('pp-count');
  countEl.textContent = `${idx + 1} / ${_ppPhotos.length}`;
  countEl.classList.toggle('pp-visible', multi);
  photoEl.querySelector('.pp-prev').classList.toggle('pp-visible', multi && idx > 0);
  photoEl.querySelector('.pp-next').classList.toggle('pp-visible', multi && idx < _ppPhotos.length - 1);
}

let _ppNavAt = 0;

function ppStep(dir, e) {
  e.stopPropagation();
  _ppNavAt = Date.now();
  ppShowPhoto(Math.max(0, Math.min(_ppPhotos.length - 1, _ppIdx + dir)));
}

function preloadPopupPhotos(photos) {
  for (let i = 1; i < photos.length; i++) {
    new Image().src = photoUrl(photos[i], 600, 450);
  }
}

function hideMapPopup() {
  document.getElementById("map-popup").style.display = "none";
  document.getElementById("pin-tooltip").style.display = "none";
  document.getElementById("map-wrap").classList.remove("popup-active");
  if (_popupVendor) {
    document.getElementById(`pin-${_popupVendor.id}`)?.classList.remove("hov");
  }
  document.querySelectorAll(".fvm-pin.sel").forEach(p => p.classList.remove("sel"));
  _activeCardId = null;
  selectedVendor   = null;
  _popupLocked  = false;
  _popupVendor     = null;
}

function scheduleHideMapPopup() {
  _popupHideTimer = setTimeout(hideMapPopup, 600);
}

function cancelHideMapPopup() {
  clearTimeout(_popupHideTimer);
}

document.getElementById("map-popup").addEventListener("mouseenter", () => {
  _popupLocked = true;
  cancelHideMapPopup();
});
document.getElementById("map-popup").addEventListener("mouseleave", () => {
  _popupLocked = false;
  scheduleHideMapPopup();
});

let _activeCardId = null;

// ════════════════════════
//  GALLERY — group-based mosaic strip
// ════════════════════════
const GAL_PER_PAGE = 5;

const PH_SVG_SM = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`;
const PH_SVG_LG = `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`;

function renderGallery() {
  const strip = document.getElementById("sg-strip");
  if (!strip) return;

  const total       = galPhotos.length;
  const totalGroups = Math.max(1, Math.ceil(total / GAL_PER_PAGE));

  let html = '';
  for (let g = 0; g < totalGroups; g++) {
    const s = g * GAL_PER_PAGE;
    html += `<div class="sg-group">`;
    const main = galPhotos[s];
    html += main
      ? `<div class="sg-ph-big" onclick="openLightbox(${s})" style="background-image:url('${photoUrl(main,800,600)}')"></div>`
      : `<div class="sg-ph-big sg-ph-placeholder">${PH_SVG_LG}</div>`;
    for (let i = 1; i <= 4; i++) {
      const p = galPhotos[s + i];
      html += p
        ? `<div class="sg-ph-sm" onclick="openLightbox(${s+i})" style="background-image:url('${photoUrl(p,400,300)}')"></div>`
        : `<div class="sg-ph-sm sg-ph-placeholder">${PH_SVG_SM}</div>`;
    }
    html += `</div>`;
  }

  strip.innerHTML = html;
  strip.style.transition = 'none';
  strip.style.transform  = 'translateX(0)';
  galPage = 0;
  _galUpdateArrows(totalGroups);
}

function _galUpdateArrows(totalGroups) {
  if (totalGroups === undefined) {
    const strip = document.getElementById("sg-strip");
    totalGroups = strip ? strip.children.length : 1;
  }
  document.getElementById("gal-prev").style.display = galPage > 0                ? "flex" : "none";
  document.getElementById("gal-next").style.display = galPage < totalGroups - 1  ? "flex" : "none";
}

function galPageStep(dir, e) {
  if (e) e.stopPropagation();
  const strip = document.getElementById("sg-strip");
  if (!strip) return;
  const totalGroups = strip.children.length;
  galPage = Math.max(0, Math.min(totalGroups - 1, galPage + dir));
  strip.style.transition = 'transform 0.38s cubic-bezier(0.32, 0.72, 0, 1)';
  strip.style.transform  = `translateX(-${galPage * 100}%)`;
  _galUpdateArrows(totalGroups);
}

// ════════════════════════
//  LIGHTBOX
// ════════════════════════
function openLightbox(idx) {
  galIdx = idx;
  document.getElementById("lightbox").classList.add("open");
  updateLightbox();
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
}

function lbStep(dir) {
  galIdx = Math.max(0, Math.min(galPhotos.length - 1, galIdx + dir));
  updateLightbox();
}

function updateLightbox() {
  document.getElementById("lb-photo").style.backgroundImage =
    galPhotos[galIdx] ? `url('${photoUrl(galPhotos[galIdx],1200,800)}')` : "none";
  document.getElementById("lb-count").textContent =
    galPhotos.length > 1 ? `${galIdx + 1} / ${galPhotos.length}` : "";
  document.getElementById("lb-prev").style.display = galIdx > 0 ? "flex" : "none";
  document.getElementById("lb-next").style.display = galIdx < galPhotos.length - 1 ? "flex" : "none";
}

document.getElementById("lightbox").addEventListener("click", e => {
  if (e.target.id === "lightbox" || e.target.id === "lb-photo") closeLightbox();
});

document.addEventListener("keydown", e => {
  if (!document.getElementById("lightbox").classList.contains("open")) return;
  if (e.key === "Escape")     { e.preventDefault(); closeLightbox(); }
  if (e.key === "ArrowLeft")  { e.preventDefault(); lbStep(-1); }
  if (e.key === "ArrowRight") { e.preventDefault(); lbStep(1);  }
});

// ════════════════════════
//  MAP
// ════════════════════════
// Restore last-known position instantly so the page never flickers to UK view
const _savedPos = (() => {
  try { const p = sessionStorage.getItem('lsf_pos'); return p ? JSON.parse(p) : null; }
  catch { return null; }
})();
const map = L.map("map", {
  center: _savedPos ? [_savedPos.lat, _savedPos.lng] : [52.8, -1.8],
  zoom:   _savedPos ? (_savedPos.zoom || 12) : 6,
  zoomControl: false
});
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains:"abcd", maxZoom:19
}).addTo(map);
L.control.zoom({ position:"topright" }).addTo(map);

// ── Sheet height: align ceiling with the bottom of the top zoom button ──
function updateSheetHeight() {
  const zoomIn  = document.querySelector('.leaflet-control-zoom-in');
  const sheetEl = document.getElementById('vendor-sheet');
  if (!zoomIn || !sheetEl) return;
  const h = Math.max(300, Math.round(window.innerHeight - zoomIn.getBoundingClientRect().top - 8));
  sheetEl.style.height = h + 'px';
  if (sheetState !== 'hidden') applySheetState(sheetState, false);
}
requestAnimationFrame(() => requestAnimationFrame(updateSheetHeight));
window.addEventListener('resize', updateSheetHeight, { passive: true });

// ── User location beacon ──
function showUserBeacon(latlng) {
  if (_userMarker) map.removeLayer(_userMarker);
  const icon = L.divIcon({
    className: "",
    html: `<div class="user-beacon"><div class="user-beacon-ring"></div><div class="user-beacon-dot"></div></div>`,
    iconSize: [22, 22],
    iconAnchor: [11, 11]
  });
  _userMarker = L.marker(latlng, { icon, zIndexOffset: 600, interactive: false }).addTo(map);
}

// ── Locate button ──
const LocateCtl = L.Control.extend({
  options: { position:"topright" },
  onAdd() {
    const b = L.DomUtil.create("div","locate-btn leaflet-bar");
    b.title = "Find me";
    b.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round">
      <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
      <circle cx="12" cy="12" r="8"/></svg>`;
    L.DomEvent.on(b, "click", () => { nearLabel = null; _progMove = true; map.locate({ setView:true, maxZoom:14 }); });
    return b;
  }
});
new LocateCtl().addTo(map);

map.on("locationfound", e => {
  // Locate button was clicked — show beacon and save position
  showUserBeacon(e.latlng);
  try {
    sessionStorage.setItem('lsf_pos', JSON.stringify({
      lat: e.latlng.lat, lng: e.latlng.lng, zoom: map.getZoom()
    }));
  } catch {}
  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${e.latlng.lat}&lon=${e.latlng.lng}`)
    .then(r => r.json())
    .then(d => {
      const a = d.address || {};
      nearLabel = a.town || a.city || a.village || a.suburb || a.county || "you";
    }).catch(() => { nearLabel = "you"; });
});

map.on("click", () => { _popupLocked = false; hideMapPopup(); hideSearch(); });

map.on("moveend", () => {
  if (_progMove) { _progMove = false; } else { nearLabel = null; }
  requestAnimationFrame(updatePinLabels);
});

// ════════════════════════
//  CLUSTER ICON
// ════════════════════════
function clusterIcon(cluster) {
  const n = cluster.getChildCount();
  const big = n > 99;
  return L.divIcon({
    className: '',
    html: `<div class="lsf-cluster${big ? ' big' : ''}">${n}</div>`,
    iconSize:   big ? [44, 44] : [36, 36],
    iconAnchor: big ? [22, 22] : [18, 18]
  });
}

// ════════════════════════
//  PINS
// ════════════════════════
function makeLargePinIcon(vendor) {
  return L.divIcon({
    className: "",
    html: `<div class="fvm-pin fvm-pin-lg" id="pin-${vendor.id}"><svg width="25" height="34" viewBox="0 0 22 30" style="overflow:visible" xmlns="http://www.w3.org/2000/svg"><g filter="url(#pin-shadow)"><circle fill="white" cx="11" cy="11" r="11"/><polygon fill="white" points="4,19 11,29 18,19"/><circle class="pin-body" cx="11" cy="11" r="8.5"/><g transform="translate(5,5) scale(0.5)" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></g></g></svg><span class="pin-label">${vendor.name}</span></div>`,
    iconSize:   [25, 34],
    iconAnchor: [12, 33]
  });
}

// ════════════════════════
//  INIT MARKERS — called once after vendors.json loads
// ════════════════════════
function initMarkers() {
  clusterGroup = L.markerClusterGroup({
    chunkedLoading: true,
    // Cluster aggressively at UK-overview zoom so no lone pins appear,
    // but shrink to near-zero at regional zoom (10+) so vendors show as
    // individual pins — closer to Bing/Google than numbered badge clusters.
    // Only genuinely co-located vendors (same market address) group at zoom 10+.
    maxClusterRadius: zoom => zoom <= 6 ? 150 : zoom <= 8 ? 100 : zoom <= 10 ? 25 : 15,
    showCoverageOnHover: false,
    iconCreateFunction: clusterIcon,
    spiderfyOnMaxZoom: true,
    removeOutsideVisibleBounds: true,
    animate: true,
  });

  VENDORS.forEach(vendor => {
    if (!vendor.lat || !vendor.lng) return;
    const marker = L.marker([vendor.lat, vendor.lng], {
      icon: makeLargePinIcon(vendor)
    });

    marker.on('click', e => {
      L.DomEvent.stopPropagation(e);
      hideMapPopup();
      pinClickVendor(vendor);
    });

    // Hover via Leaflet events (fire when pin is visible, not when clustered)
    marker.on('mouseover', () => {
      cancelHideMapPopup();
      if (_popupVendor && _popupVendor.id === vendor.id) return;
      clearTimeout(_hoverTimer);
      _hoverTimer = setTimeout(() => {
        if (_popupLocked) return;
        document.querySelectorAll(".fvm-pin.hov").forEach(p => p.classList.remove("hov"));
        const pinEl = document.getElementById(`pin-${vendor.id}`);
        if (pinEl) pinEl.classList.add("hov");
        showMapPopup(vendor);
      }, 180);
    });

    marker.on('mouseout', () => {
      clearTimeout(_hoverTimer);
      const pinEl = document.getElementById(`pin-${vendor.id}`);
      if (pinEl) pinEl.classList.remove("hov");
      scheduleHideMapPopup();
    });

    clusterGroup.addLayer(marker);
    markerMap[vendor.id] = marker;
  });

  map.addLayer(clusterGroup);
  requestAnimationFrame(updatePinLabels);
}

// ════════════════════════
//  PIN CLICK → open popup + sheet
// ════════════════════════
function pinClickVendor(vendor) {
  selectedVendor = vendor;
  hideSearch();
  document.querySelectorAll(".fvm-pin").forEach(el => el.classList.remove("sel"));
  const pin = document.getElementById(`pin-${vendor.id}`);
  if (pin) pin.classList.add("sel");
  _activeCardId = vendor.id;
  _popupLocked = true;
  showMapPopup(vendor);
}

// ════════════════════════
//  VENDOR DETAIL — bottom sheet
// ════════════════════════
function openSheet(vendor) {
  // Gallery
  galPhotos = vendor.photos || (vendor.photo ? [vendor.photo] : []);
  galIdx    = 0;
  galPage   = 0;
  renderGallery();

  document.getElementById("sheet-name").textContent = vendor.name;

  // Website
  const siteUrl = vendor.website ? vendor.website.replace(/^https?:\/\//, "") : "";
  document.getElementById("sheet-website").innerHTML = siteUrl
    ? `<a href="https://${siteUrl}" target="_blank" rel="noopener">${siteUrl}</a>`
    : "";

  // Tagline / cuisine type
  document.getElementById("sheet-cuisine").textContent = vendor.tagline || cuisineLabel(vendor.cuisine);

  // Location: city
  const locPin = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:2px"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>`;
  document.getElementById("sheet-location").innerHTML = vendor.city
    ? `${locPin}<span>${vendor.city}</span>`
    : "";

  // Status — no schedule for these vendors
  document.getElementById("sheet-status").innerHTML = "";
  document.getElementById("sheet-status").className = "vi-status";

  // Schedule placeholder
  document.getElementById("sheet-sched").textContent = "Market schedule coming soon";

  // Dietary tags
  const dietaryHtml = (vendor.dietary || []).slice(0, 8)
    .map(d => `<span class="sheet-diet-tag">${d}</span>`)
    .join('');
  document.getElementById("sheet-dietary").innerHTML = dietaryHtml;

  // Description
  document.getElementById("sheet-desc").textContent = vendor.desc || "";

  // Instagram
  const igEl = document.getElementById("sheet-instagram");
  igEl.innerHTML = vendor.instagram
    ? `<a class="ig-link" href="https://instagram.com/${vendor.instagram.replace(/^@/,'')}" target="_blank" rel="noopener">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        Menu &amp; updates
       </a>`
    : "";

  document.getElementById("sheet-scroll").scrollTop = 0;
  applySheetState('full');
}

// ════════════════════════
//  BOTTOM SHEET STATE MACHINE
// ════════════════════════
let sheetState = 'hidden';

function applySheetState(state, animate = true) {
  const sheetEl   = document.getElementById('vendor-sheet');
  const overlayEl = document.getElementById('sheet-overlay');
  sheetState = state;
  const h = sheetEl.offsetHeight || Math.round(window.innerHeight * 0.88);
  sheetEl.style.transition = animate
    ? 'transform 0.38s cubic-bezier(0.32, 0.72, 0, 1)' : 'none';
  sheetEl.style.transform  = `translateX(-50%) translateY(${state === 'full' ? 0 : h}px)`;
  overlayEl.classList.toggle('open', state === 'full');
  sheetEl.classList.toggle('open', state !== 'hidden');
}

function selectVendor(vendor) {
  selectedVendor = vendor;
  _activeCardId = vendor.id;
  hideSearch();
  document.querySelectorAll(".fvm-pin").forEach(el => el.classList.remove("sel"));
  const pin = document.getElementById(`pin-${vendor.id}`);
  if (pin) pin.classList.add("sel");
  openSheet(vendor);
}

function closeSheet() {
  applySheetState('hidden');
  document.querySelectorAll(".fvm-pin").forEach(el => el.classList.remove("sel"));
  selectedVendor = null;
  _activeCardId = null;
}

// ════════════════════════
//  SEARCH
// ════════════════════════
const $si = document.getElementById("search-input");
const $sd = document.getElementById("search-drop");
let kbIdx = -1;
const norm = s => (s || "").toLowerCase();

function getVendorResults(q) {
  if (!q.trim()) return VENDORS.slice(0, 50); // cap empty results
  const lq = norm(q);
  return VENDORS.filter(v =>
    norm(v.name).includes(lq)    ||
    norm(v.tagline).includes(lq) ||
    norm(v.city).includes(lq)    ||
    (v.cuisine || []).some(c => norm(CUISINE_LABEL[c] || c).includes(lq)) ||
    (v.dietary || []).some(d => norm(d).includes(lq))
  );
}

let _geoTimer = null;

const SHORTCUTS_HTML = `
<div class="dr" data-type="nearby" role="option">
  <div class="dr-name">Nearby</div>
  <div class="dr-sub">Find what's around you</div>
</div>
<div class="srch-shortcuts">
  <div class="dr-section">Popular areas</div>
  <div class="srch-chips">
    ${['London','Edinburgh','Bristol','Bath','Glasgow','Manchester','Birmingham','Brighton'].map(a =>
      `<button class="srch-chip" onmousedown="event.preventDefault()" onclick="chipSearch('${a}')">${a}</button>`
    ).join('')}
  </div>
  <div class="dr-section">Food types</div>
  <div class="srch-chips">
    ${['Pizza','BBQ','Burgers','Vegan','Halal','Tacos','Doughnuts','Coffee'].map(c =>
      `<button class="srch-chip" onmousedown="event.preventDefault()" onclick="chipSearch('${c}')">${c}</button>`
    ).join('')}
  </div>
</div>`;

function chipSearch(q) {
  $si.value = q;
  renderDrop(q);
}

function renderDrop(q) {
  kbIdx = -1;
  const vendors = getVendorResults(q);
  const html = vendors.slice(0, 20).map(v =>
    `<div class="dr" data-type="vendor" data-id="${v.id}" role="option">
      <div class="dr-name">${v.name}</div>
      <div class="dr-sub">${v.tagline || cuisineLabel(v.cuisine)}${v.city ? ' · ' + v.city : ''}</div>
    </div>`
  ).join("");

  $sd.innerHTML = !q.trim()
    ? SHORTCUTS_HTML
    : ((html || "") + `<div id="geo-results"></div>`);

  if (q.trim() && !html) {
    $sd.innerHTML = `<div class="dr-none">No results for "${q}"</div><div id="geo-results"></div>`;
  }

  bindDropClicks();
  $sd.hidden = false;
  $si.setAttribute("aria-expanded","true");

  clearTimeout(_geoTimer);
  if (q.trim().length >= 2) {
    _geoTimer = setTimeout(() => {
      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=gb&limit=3&addressdetails=1`)
        .then(r => r.json())
        .then(places => {
          const $geo = document.getElementById("geo-results");
          if (!$geo || !places.length) return;
          const seenNames = new Set();
          const uniquePlaces = places.filter(p => {
            const n = p.address.city || p.address.town || p.address.village || p.address.county || p.display_name.split(",")[0];
            if (seenNames.has(n)) return false;
            seenNames.add(n);
            return true;
          });
          const label = vendors.length ? `<div class="dr-section">Places</div>` : "";
          $geo.innerHTML = label + uniquePlaces.map(p => {
            const name = p.address.city || p.address.town || p.address.village || p.address.county || p.display_name.split(",")[0];
            const sub  = p.display_name.split(",").slice(1,3).join(",").trim();
            return `<div class="dr" data-type="place" data-lat="${p.lat}" data-lng="${p.lon}" data-name="${name}" role="option">
              <div class="dr-name">${name}</div>
              <div class="dr-sub">${sub}</div>
            </div>`;
          }).join("");
          bindDropClicks();
        }).catch(() => {});
    }, 300);
  }
}

function bindDropClicks() {
  $sd.querySelectorAll(".dr").forEach(el => {
    el.addEventListener("mousedown", e => {
      e.preventDefault();
      if (el.dataset.type === "nearby") {
        $si.value = ""; hideSearch();
        nearLabel = null; _progMove = true;
        map.locate({ setView: true, maxZoom: 14 });
      } else if (el.dataset.type === "place") {
        pickPlace(+el.dataset.lat, +el.dataset.lng, el.dataset.name);
      } else {
        pickResult(VENDORS.find(v => v.id === +el.dataset.id));
      }
    });
  });
}

function pickPlace(lat, lng, name) {
  $si.value = ""; hideSearch();
  nearLabel = name; _progMove = true;
  map.setView([lat, lng], 13, { animate:true });
}

function pickResult(vendor) {
  if (!vendor || !vendor.lat || !vendor.lng) return;
  $si.value = ""; hideSearch();
  nearLabel = vendor.city || null;
  _progMove = true;
  map.setView([vendor.lat, vendor.lng], 15, { animate:true });
  setTimeout(() => pinClickVendor(vendor), 300);
}

function hideSearch() {
  $sd.hidden = true;
  $si.setAttribute("aria-expanded","false");
}

$si.addEventListener("focus",   () => renderDrop($si.value));
$si.addEventListener("input",   () => renderDrop($si.value));
$si.addEventListener("blur",    () => setTimeout(hideSearch, 150));
$si.addEventListener("keydown", e => {
  const items = [...$sd.querySelectorAll(".dr")];
  if (!items.length) return;
  if      (e.key === "ArrowDown")           { e.preventDefault(); kbIdx = Math.min(kbIdx+1, items.length-1); }
  else if (e.key === "ArrowUp")             { e.preventDefault(); kbIdx = Math.max(kbIdx-1, 0); }
  else if (e.key === "Enter" && kbIdx >= 0) {
    const el = items[kbIdx];
    if (el.dataset.type === "nearby") {
      $si.value = ""; hideSearch();
      nearLabel = null; _progMove = true;
      map.locate({ setView: true, maxZoom: 14 });
    } else if (el.dataset.type === "place") {
      pickPlace(+el.dataset.lat, +el.dataset.lng, el.dataset.name);
    } else {
      pickResult(VENDORS.find(v => v.id === +el.dataset.id));
    }
    return;
  }
  else if (e.key === "Escape") { hideSearch(); return; }
  items.forEach((el,i) => el.classList.toggle("kact", i === kbIdx));
});

function addYourListing() {

// ════════════════════════
//  PIN LABEL VISIBILITY
// ════════════════════════
function updatePinLabels() {
  const entries = Object.entries(markerMap);
  if (!entries.length) return;

  if (map.getZoom() < 14) {
    entries.forEach(([id]) => {
      document.querySelector(`#pin-${id} .pin-label`)?.classList.add("lbl-hidden");
    });
    return;
  }

  const pts = entries.map(([id, m]) => ({
    id,
    pt: map.latLngToContainerPoint(m.getLatLng())
  }));

  pts.forEach(({ id, pt }) => {
    const label = document.querySelector(`#pin-${id} .pin-label`);
    if (!label) return;

    const tooClose = pts.some(other => {
      if (other.id === id) return false;
      return Math.abs(other.pt.x - pt.x) < 20 && Math.abs(other.pt.y - pt.y) < 20;
    });
    if (tooClose) { label.classList.add("lbl-hidden"); return; }

    const blocked = pts.some(other => {
      if (other.id === id) return false;
      const dx = other.pt.x - pt.x;
      const dy = Math.abs(other.pt.y - pt.y);
      return dx > 8 && dx < 160 && dy < 26;
    });
    label.classList.toggle("lbl-hidden", blocked);
  });
}

map.on("zoomend moveend", updatePinLabels);

map.on("zoomstart dragstart", () => {
  clearTimeout(_popupHideTimer);
  clearTimeout(_hoverTimer);
  hideMapPopup();
});

// ════════════════════════
//  GEOLOCATION
//  On load:   sessionStorage (instant) → IP geo (city-level, no prompt, no beacon)
//  On button: Leaflet map.locate() → precise GPS, beacon shown (user-initiated)
//  No automatic GPS prompt — matches Bing; avoids iOS Safari silent-deny.
// ════════════════════════

// Save position on manual pan/zoom so next visit opens exactly here.
map.on('moveend zoomend', () => {
  if (map.getZoom() < 8) return; // don't save the UK overview
  try {
    const c = map.getCenter();
    sessionStorage.setItem('lsf_pos', JSON.stringify({ lat: c.lat, lng: c.lng, zoom: map.getZoom() }));
  } catch {}
});

// Target zoom — shows roughly a 50km radius (Oxford→Swindon→Reading scale)
const GEO_ZOOM = 10;

// IP-based geolocation — city-level, no permission prompt, first-visit only.
// Centres the map silently; no beacon shown.
async function tryIPGeolocation() {
  if (_savedPos) return; // sessionStorage already positioned the map
  try {
    const r = await fetch('https://ipapi.co/json/', { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    if (d.latitude && d.longitude && map.getZoom() < 8) {
      map.setView([d.latitude, d.longitude], GEO_ZOOM, { animate: false });
    }
  } catch {}
}

// ════════════════════════
//  LOAD DATA + BOOT
// ════════════════════════
async function loadVendors() {
  try {
    const resp = await fetch('vendors.json');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    VENDORS = await resp.json();
  } catch (err) {
    console.error('Failed to load vendors.json:', err);
    VENDORS = [];
  }

  // Dismiss loading screen
  const overlay = document.getElementById('loading-overlay');
  overlay.classList.add('hidden');
  setTimeout(() => { overlay.style.display = 'none'; }, 350);

  initMarkers();
  updateSheetHeight();
}

// IP geo and data fetch run in parallel; GPS only fires on locate button click
tryIPGeolocation();
loadVendors();

</script>
