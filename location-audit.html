<h1>🗺️ Vendor Location Audit</h1>
<p class="subtitle">Reverse geocodes each vendor's coordinates via OpenStreetMap Nominatim to flag likely residential/office addresses.</p>

  <div id="currentVendor">Ready to start.</div>
  <div style="margin-top:14px">
    <button id="startBtn" onclick="startAudit()">▶ Start Audit</button>
    <button id="stopBtn" onclick="stopAudit()">⏸ Pause</button>
    <button id="downloadBtn" onclick="downloadCsv()">⬇ Download CSV</button>
    <button id="resetBtn" onclick="resetAudit()">🗑 Reset &amp; restart</button>
  </div>
</div>

<div class="results">
  <div class="filter-bar">
    <label>Show:</label>
    <select id="filterFlag" onchange="renderTable()">

      <option value="amber">⚠️ Uncertain only</option>

      <option value="green">✅ OK only</option>
    </select>
    <input type="text" id="filterText" placeholder="Search name/city…" oninput="renderTable()">
  </div>
  <table>
    <thead><tr><th>Vendor</th><th>City</th><th>OSM result</th><th>Flag</th><th>Map</th></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

const LS_KEY = 'lsf_location_audit_v1';
const DELAY_MS = 1100; // Nominatim: max 1 req/sec

let results = {};
let running = false;
let abortFlag = false;

// Load saved progress and re-run classification on everything (picks up logic updates)
function loadProgress() {
  try { results = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch(e) { results = {}; }
  // Re-classify all stored results using current logic
  let changed = false;
  for (const slug of Object.keys(results)) {
    const r = results[slug];
    if (r.cat !== undefined) {
      const { flag, reason } = classify({ category: r.cat, type: r.type, address: r.address || {} });
      if (flag !== r.flag || reason !== r.reason) {
        r.flag = flag;
        r.reason = reason;
        changed = true;
      }
    }
  }
  if (changed) saveProgress();
}

function saveProgress() {
  localStorage.setItem(LS_KEY, JSON.stringify(results));
}

// Classification logic
function classify(data) {
  if (!data) return { flag: 'amber', reason: 'No response' };
  const cat = (data.category || '').toLowerCase();
  const type = (data.type || '').toLowerCase();
  const addr = data.address || {};
  const hasHouseNumber = !!addr.house_number;

  // Any of these in cat OR type = almost certainly a home/office address
  const badResidentialWords = ['house','residential','apartments','detached','terrace',
    'semidetached_house','bungalow','dormitory','static_caravan','flat','maisonette'];
  const badLanduse = ['residential','farmland','meadow','grass','forest','cemetery','allotments'];

  // Good: recognised food/commercial amenity
  const goodCats = ['amenity','shop','tourism','leisure'];
  const goodTypes = ['restaurant','fast_food','cafe','food_court','marketplace','market','bar','pub','food','takeaway','catering'];
  if (goodCats.includes(cat)) {
    return { flag: 'green', reason: `${cat}=${type}` };
  }
  // Good: food-type value even if category is building (OSM inconsistency)
  if (goodTypes.some(t => type.includes(t))) {
    return { flag: 'green', reason: `${cat}=${type}` };
  }
  // Good: commercial/industrial land use (kitchen units, market sites)
  if (cat === 'landuse' && ['commercial','industrial','retail'].includes(type)) {
    return { flag: 'green', reason: `landuse=${type}` };
  }

  // Red: residential land use
  if (cat === 'landuse' && badLanduse.includes(type)) {
    return { flag: 'red', reason: `landuse=${type}` };
  }
  // Red: office / professional services — clearly a business address not a trading pitch
  if (cat === 'office') {
    return { flag: 'red', reason: `office=${type} — business address` };
  }
  const officeTypes = ['lawyer','solicitor','accountant','estate_agent','insurance','financial','company','government','ngo'];
  if (officeTypes.includes(type)) {
    return { flag: 'red', reason: `${cat}=${type} — business/office address` };
  }
  // Red: any building or place type that screams "home"
  if (badResidentialWords.includes(type)) {
    return { flag: 'red', reason: `${cat}=${type}` + (hasHouseNumber ? ` (#${addr.house_number})` : '') };
  }
  // Red: generic building with a house number (numbered residential property)
  if (cat === 'building' && hasHouseNumber) {
    return { flag: 'red', reason: `building with house number (#${addr.house_number})` };
  }
  // Amber: only resolved to a broad place level — coordinates may be a postcode centroid
  if (cat === 'place' && ['suburb','neighbourhood','quarter','village','town','city','postcode'].includes(type)) {
    return { flag: 'amber', reason: `Resolved to ${type} level only — coordinates may be approximate` };
  }
  // Amber: street level — could be street trading or just an approximate address
  if (cat === 'highway') {
    return { flag: 'amber', reason: `highway=${type} — street-level, could be street trading or approximate` };
  }
  // Amber: any other building without a house number — could be commercial unit
  if (cat === 'building') {
    return { flag: 'amber', reason: `building=${type} — check if commercial or residential` };
  }
  return { flag: 'amber', reason: `${cat}=${type}` };
}

async function geocode(lat, lng) {
  const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&zoom=18&addressdetails=1`;
  const r = await fetch(url, { headers: { 'User-Agent': 'LocalStreetFood/1.0 (localstreetfood.com)' } });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

function stopAudit() {
  abortFlag = true;
  document.getElementById('stopBtn').style.display = 'none';
  document.getElementById('startBtn').disabled = false;
  document.getElementById('startBtn').textContent = `▶ Resume (${Object.keys(results).length}/${VENDORS.length} done)`;
  document.getElementById('currentVendor').textContent = 'Paused. Click Resume to continue.';
}

async function startAudit() {
  loadProgress();
  running = true;
  abortFlag = false;
  document.getElementById('startBtn').disabled = true;
  document.getElementById('startBtn').textContent = '⏳ Running…';
  document.getElementById('stopBtn').style.display = '';
  document.getElementById('resetBtn').style.display = '';

  const todo = VENDORS.filter(v => !results[v.slug]);
  let i = 0;
  for (const v of todo) {
    if (abortFlag) break;
    document.getElementById('currentVendor').textContent = `[${Object.keys(results).length + 1}/${VENDORS.length}] ${v.name} (${v.city})…`;
    try {
      const data = await geocode(v.lat, v.lng);
      const { flag, reason } = classify(data);
      results[v.slug] = {
        id: v.id, name: v.name, city: v.city, lat: v.lat, lng: v.lng,
        flag, reason,
        display: data.display_name || '',
        cat: data.category || '', type: data.type || '',
        address: data.address || {}
      };
    } catch(e) {
      results[v.slug] = { id: v.id, name: v.name, city: v.city, lat: v.lat, lng: v.lng,
        flag: 'amber', reason: `Error: ${e.message}`, display: '', cat: '', type: '', address: {} };
    }
    if (i % 10 === 0) saveProgress();
    updateStats();
    renderTable();
    await sleep(DELAY_MS);
    i++;
  }
  saveProgress();
  running = false;
  document.getElementById('stopBtn').style.display = 'none';
  const done = Object.keys(results).length >= VENDORS.length;
  document.getElementById('startBtn').textContent = done ? '✅ Complete' : `▶ Resume (${Object.keys(results).length}/${VENDORS.length} done)`;
  document.getElementById('startBtn').disabled = done;
  document.getElementById('currentVendor').textContent = done
    ? `Done! ${VENDORS.length} vendors audited.` : 'Paused. Click Resume to continue.';
  document.getElementById('downloadBtn').style.display = '';
}

function updateStats() {
  const vals = Object.values(results);
  document.getElementById('statTotal').textContent = vals.length;
  document.getElementById('statGood').textContent = vals.filter(r=>r.flag==='green').length;
  document.getElementById('statAmber').textContent = vals.filter(r=>r.flag==='amber').length;
  document.getElementById('statRed').textContent = vals.filter(r=>r.flag==='red').length;
  document.getElementById('statSkipped').textContent = VENDORS.length - vals.length;
  document.getElementById('bar').style.width = (vals.length / VENDORS.length * 100).toFixed(1) + '%';
}

function renderTable() {
  const filterFlag = document.getElementById('filterFlag').value;
  const filterText = document.getElementById('filterText').value.toLowerCase();
  const flags = filterFlag === 'all' ? ['red','amber','green'] : filterFlag.split(',');
  const rows = Object.values(results)
    .filter(r => flags.includes(r.flag))
    .filter(r => !filterText || r.name.toLowerCase().includes(filterText) || (r.city||'').toLowerCase().includes(filterText))
    .sort((a,b) => {
      const order = {red:0, amber:1, green:2};
      return order[a.flag] - order[b.flag] || a.name.localeCompare(b.name);
    });

  const emoji = {red:'🔴', amber:'⚠️', green:'✅'};
  const cls = {red:'flag-red', amber:'flag-amber', green:'flag-green'};
  const mapsUrl = r => `https://www.google.com/maps?q=${r.lat},${r.lng}`;
  const shortAddr = r => {
    const a = r.address;
    return [a.road||a.pedestrian||a.footway, a.suburb||a.neighbourhood, a.city||a.town||a.village].filter(Boolean).join(', ') || r.display.split(',').slice(0,3).join(',');
  };

  document.getElementById('tableBody').innerHTML = rows.map(r => `
    <tr>
      <td><strong>${r.name}</strong></td>
      <td>${r.city||'—'}</td>
      <td style="font-size:0.78rem;color:#555">${shortAddr(r)}<br><span style="color:#999">${r.cat}=${r.type}</span></td>
      <td class="${cls[r.flag]}">${emoji[r.flag]} ${r.reason}</td>
      <td><a class="map-link" href="${mapsUrl(r)}" target="_blank">Maps ↗</a></td>
    </tr>`).join('');
}

function downloadCsv() {
  const rows = [['id','slug','name','city','lat','lng','flag','reason','osm_category','osm_type','display_name']];
  for (const r of Object.values(results)) {
    rows.push([r.id, Object.keys(results).find(k=>results[k]===r)||'', r.name, r.city||'', r.lat, r.lng, r.flag, r.reason, r.cat, r.type, `"${(r.display||'').replace(/"/g,'""')}"`]);
  }
  const csv = rows.map(r=>r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'location-audit.csv';
  a.click();
}

function resetAudit() {
  if (!confirm('Clear all saved progress and start fresh?')) return;
  localStorage.removeItem(LS_KEY);
  results = {};
  updateStats();
  renderTable();
  document.getElementById('downloadBtn').style.display = 'none';
  document.getElementById('currentVendor').textContent = 'Reset. Ready to start.';
  document.getElementById('startBtn').textContent = '▶ Start Audit';
  document.getElementById('startBtn').disabled = false;
}

// Init
loadProgress();
updateStats();
renderTable();
if (Object.keys(results).length > 0) {
  const done = Object.keys(results).length >= VENDORS.length;
  document.getElementById('startBtn').textContent = done ? '✅ Complete' : `▶ Resume (${Object.keys(results).length}/${VENDORS.length} done)`;
  document.getElementById('startBtn').disabled = done;
  document.getElementById('downloadBtn').style.display = '';
  document.getElementById('resetBtn').style.display = '';
  document.getElementById('currentVendor').textContent = done
    ? `Complete — ${VENDORS.length} vendors audited.`
    : `${Object.keys(results).length} results from previous session. Click Resume to continue.`;
}
</script>
